[project]
name = "cleanspark-alert-agent"
version = "1.0.0"
description = "LangGraph-powered CleanSpark stock anomaly monitor and attribution agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "apscheduler==3.11.2",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "langchain-openai==1.1.12",
  "langgraph==1.2.12",
  "pydantic-settings==2.13.1",
  "python-multipart==0.0.22",
  "tavily-python==0.7.23",
  "uvicorn[standard]==0.41.0",
  "yfinance==1.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
]

[project.scripts]
cleanspark-agent = "app.main:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
